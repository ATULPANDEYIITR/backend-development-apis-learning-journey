<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Path and Query Parameters</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main class="container">
        <header>
            <h1>Path and Query Parameters</h1>
            <p>
                Use the controls below to construct query parameters and
                observe how they change the API request.
            </p>
        </header>

        <section class="panel">
            <form id="search-form">
                <label for="category">Category</label>
                <input
                    id="category"
                    name="category"
                    type="text"
                    minlength="2"
                    maxlength="30"
                    placeholder="electronics"
                >

                <label for="search">Search</label>
                <input
                    id="search"
                    name="search"
                    type="text"
                    minlength="1"
                    maxlength="50"
                    placeholder="mouse"
                >

                <label for="min_price">Minimum price</label>
                <input
                    id="min_price"
                    name="min_price"
                    type="number"
                    min="0"
                    step="0.01"
                    placeholder="30"
                >

                <label for="max_price">Maximum price</label>
                <input
                    id="max_price"
                    name="max_price"
                    type="number"
                    min="0"
                    step="0.01"
                    placeholder="100"
                >

                <label for="limit">Limit</label>
                <input
                    id="limit"
                    name="limit"
                    type="number"
                    min="1"
                    max="20"
                    value="5"
                >

                <label class="checkbox">
                    <input
                        id="in_stock"
                        name="in_stock"
                        type="checkbox"
                    >
                    Only show products currently in stock
                </label>

                <div class="actions">
                    <button type="submit">Search</button>
                    <button id="reset-button" type="button">Reset</button>
                </div>
            </form>
        </section>

        <p id="error-message" class="error" hidden></p>

        <section id="results" class="results" aria-live="polite"></section>
    </main>

    <script type="module" src="./app.js"></script>
</body>
</html>
